name: One-shot Cloudflare credential presence check
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Cloudflare secret presence only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          for k in ['CLOUDFLARE_API_TOKEN','CF_API_TOKEN','CF_EMAIL','CLOUDFLARE_GLOBAL_API_KEY','CF_GLOBAL_API_KEY']:
              print(f'{k}=' + ('PRESENT' if bool(os.environ.get(k)) else 'ABSENT'))
          PY
