name: Verify public integration surface

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:live
      - name: Preserve MCP manifest comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-manifest-${{ github.sha }}
          path: .artifacts/mcp-manifest/
          if-no-files-found: ignore
          retention-days: 7
