name: X1 STALL host orientation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/x1-stall-host-orientation.yml'

permissions:
  contents: read

jobs:
  orient:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read live STALL host state without mutation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/intuitek/the-stall"
          echo "HOST=$(hostname)"
          echo "USER=$(whoami)"
          echo "ROOT=$ROOT"
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -d "$ROOT/.git" ]; then
            echo "STALL_REPO=PRESENT"
            echo "STALL_SHA=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || true)"
            echo "STALL_BRANCH=$(git -C "$ROOT" branch --show-current 2>/dev/null || true)"
            echo "STALL_DIRTY_COUNT=$(git -C "$ROOT" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
            echo "STALL_ORIGIN=$(git -C "$ROOT" remote get-url origin 2>/dev/null || true)"
          else
            echo "STALL_REPO=ABSENT"
          fi

          echo '--- PORTS ---'
          ss -ltnp 2>/dev/null | grep -E ':(4021|4099)\b' || true

          echo '--- PROCESSES ---'
          ps -eo pid,ppid,lstart,cmd --sort=pid | grep -E 'the-stall|src/server\.js|stall-local-facilitator|cloudflared' | grep -v grep || true

          echo '--- SYSTEM SERVICES ---'
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'stall|cloudflare|aegis' | head -80 || true
          systemctl --user list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'stall|cloudflare|aegis' | head -80 || true

          echo '--- CRON/TIMERS (names only) ---'
          systemctl list-timers --all --no-pager 2>/dev/null | grep -Ei 'stall|cloudflare|aegis' | head -80 || true
          systemctl --user list-timers --all --no-pager 2>/dev/null | grep -Ei 'stall|cloudflare|aegis' | head -80 || true

          echo '--- LOG COUNTS ---'
          python3 - "$ROOT" <<'PY'
          import json, os, sys
          root=sys.argv[1]
          self_wallets=set()
          envp=os.path.join(root,'.env')
          # Read only wallet identifiers needed to classify self vs external; never print them.
          try:
              for line in open(envp,encoding='utf-8'):
                  if line.startswith('MCP_SELF_WALLETS=') or line.startswith('SEEDER_WALLET_ADDRESS=') or line.startswith('WALLET_ADDRESS='):
                      _,v=line.rstrip('\n').split('=',1)
                      self_wallets.update(x.strip().lower() for x in v.split(',') if x.strip())
          except Exception:
              pass
          def rows(name):
              p=os.path.join(root,'logs',name)
              out=[]
              try:
                  for line in open(p,encoding='utf-8'):
                      try: out.append(json.loads(line))
                      except Exception: pass
              except Exception: pass
              return out
          rest=rows('settlement.jsonl')
          mcp=rows('mcp_payments.jsonl')
          rest_settled=[r for r in rest if r.get('status')==200 and r.get('tx_hash')]
          rest_external=[]
          for r in rest_settled:
              payer=str(r.get('payer') or '').lower()
              if payer and payer not in self_wallets: rest_external.append(r)
          mcp_settled=[r for r in mcp if r.get('event')=='settled' and r.get('transaction')]
          mcp_external=[]
          for r in mcp_settled:
              payer=str(r.get('payer') or '').lower()
              if payer and payer not in self_wallets: mcp_external.append(r)
          print(f'SELF_WALLET_FILTER_COUNT={len(self_wallets)}')
          print(f'REST_SETTLED_TX_ROWS={len(rest_settled)}')
          print(f'REST_EXTERNAL_SETTLED_TX_ROWS={len(rest_external)}')
          print(f'MCP_SETTLED_TX_ROWS={len(mcp_settled)}')
          print(f'MCP_EXTERNAL_SETTLED_TX_ROWS={len(mcp_external)}')
          if rest_external:
              latest=max(rest_external,key=lambda r:str(r.get('ts') or ''))
              print('REST_LATEST_EXTERNAL_TS='+str(latest.get('ts') or ''))
              print('REST_LATEST_EXTERNAL_CAP='+str(latest.get('cap') or ''))
              print('REST_LATEST_EXTERNAL_PRICE='+str(latest.get('price') or ''))
          # Aggregate external cap counts only; no payer identifiers.
          counts={}
          revenue={}
          for r in rest_external:
              c=str(r.get('cap') or 'unknown')
              counts[c]=counts.get(c,0)+1
              try: revenue[c]=revenue.get(c,0.0)+float(str(r.get('price') or '0').replace('$',''))
              except Exception: pass
          top=sorted(counts.items(),key=lambda kv:(-kv[1],kv[0]))[:15]
          print('REST_EXTERNAL_TOP_CAPS='+json.dumps([[c,n,round(revenue.get(c,0),6)] for c,n in top],separators=(',',':')))
          PY

          echo 'HOST_ORIENTATION_EXTERNAL_EFFECT=FALSE'
          echo 'HOST_ORIENTATION_MUTATION=FALSE'
